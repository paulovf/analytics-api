name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, develop, qa]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title (Semantic Pull Request)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            feature
            fix
            hotfix
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with a capital letter.

  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name Syntax
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          REGEX="^(feat|feature|fix|hotfix|qa)/[a-zA-Z0-9_-]+$"
          if [[ ! $BRANCH_NAME =~ $REGEX ]]; then
            echo "Error: Branch name '$BRANCH_NAME' is invalid."
            echo "Must match convention: (feat|feature|fix|hotfix|qa)/description"
            exit 1
          fi
          echo "Branch name is valid."

  check-version-bump:
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' && github.head_ref == 'qa'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Version Bump
        run: |
          git fetch origin main:main

          VERSION_FILE="VERSION"

          if [ ! -f "$VERSION_FILE" ]; then
            echo "Error: Version file '$VERSION_FILE' not found."
            exit 1
          fi

          BASE_VERSION=$(git show origin/main:"$VERSION_FILE" 2>/dev/null || echo "")
          CURRENT_VERSION=$(cat "$VERSION_FILE")

          echo "Current version in main: $BASE_VERSION"
          echo "Version in PR (qa):    $CURRENT_VERSION"

          if [ "$BASE_VERSION" == "$CURRENT_VERSION" ]; then
            echo "Error: The version was not incremented in file $VERSION_FILE for this QA -> Main PR."
            exit 1
          fi

          echo "Success: The version was incremented ($BASE_VERSION -> $CURRENT_VERSION)."
